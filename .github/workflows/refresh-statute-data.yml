# Monthly refresh of the CT-Statutes datasets.
#
# Runs CT-Statutes/update_data.py, which downloads the current source PDFs and
# regenerates data/title_*.json, data/titles_index.json,
# data/statutes_index.json, and data/infractions.json. The refreshed data is
# opened as a pull request rather than pushed to main: a parser can complete
# successfully on a changed source layout and still produce wrong output, so
# the diff gets a human look before it deploys to the live site.
#
# Runner note: this job must run on Windows. cga.ct.gov serves only its leaf
# TLS certificate, without the intermediate. Windows builds the chain by
# fetching the intermediate itself (AIA), which the truststore package taps
# into; OpenSSL on the Linux runners does not, so verification fails there.

name: Refresh CT-Statutes data

on:
  schedule:
    - cron: "23 7 2 * *" # 07:23 UTC on the 2nd of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install requests beautifulsoup4 certifi truststore pdfplumber

      - name: Refresh statutes, subject index, and infractions data
        working-directory: CT-Statutes
        run: python update_data.py

      - name: Open a pull request with the refreshed data
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: CT-Statutes/data/**
          branch: auto/statute-data-refresh
          delete-branch: true
          commit-message: "CT-Statutes: scheduled data refresh"
          title: "CT-Statutes: scheduled data refresh"
          body: |
            Automated monthly refresh generated by `update_data.py` (statute
            crawl, subject-index parse, infractions parse).

            Before merging, spot-check per the README's review step:

            - [ ] `source` dates in `titles_index.json`, `statutes_index.json`, and `infractions.json` look right
            - [ ] record counts in the workflow log are close to the previous run's
            - [ ] a sample statute section, index heading, and infraction render correctly
            - [ ] if only `generated` timestamps changed, closing this PR without merging is fine

            The workflow log contains each parser's summary output.
