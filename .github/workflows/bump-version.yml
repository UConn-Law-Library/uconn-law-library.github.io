# Every time a PR is merged into main, increment the patch versions shown on
# both CT Statutes About pages as a follow-up commit by the github-actions bot.
# Direct pushes to main do not bump.
name: Bump CT Statutes versions

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# serialize bumps so two PRs merged back-to-back don't race on the push
concurrency:
  group: version-bump

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Increment APP_VERSION patch numbers
        run: |
          python3 - <<'EOF'
          import pathlib, re
          for filename in ("CT-Statutes/app.js", "CT-Statutes/next/app.js"):
              p = pathlib.Path(filename)
              src = p.read_text(encoding="utf-8")
              def bump(m):
                  major, minor, patch = m.group(2).split(".")
                  return f'{m.group(1)}"{major}.{minor}.{int(patch) + 1}"'
              out, n = re.subn(r'(const APP_VERSION = )"(\d+\.\d+\.\d+)"', bump, src, count=1)
              assert n == 1, f"APP_VERSION constant not found in {filename}"
              p.write_text(out, encoding="utf-8")
          EOF

      - name: Commit and push the bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CT-Statutes/app.js CT-Statutes/next/app.js
          git commit -m "Bump CT Statutes versions after PR #${{ github.event.pull_request.number }}"
          git push
